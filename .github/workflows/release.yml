name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets['BUILD_CERTIFICATE_BASE64'] }}
      P12_PASSWORD: ${{ secrets['P12_PASSWORD'] }}
      KEYCHAIN_PASSWORD: ${{ secrets['KEYCHAIN_PASSWORD'] }}
      CODESIGN_IDENTITY: ${{ secrets['CODESIGN_IDENTITY'] }}
      APPLE_ID: ${{ secrets['APPLE_ID'] }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets['APPLE_APP_SPECIFIC_PASSWORD'] }}
      APPLE_TEAM_ID: ${{ secrets['APPLE_TEAM_ID'] }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Import Apple Developer Certificate (Optional)
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/"//g')

      - name: Build Karu.app & KaruWidgets.appex
        run: ./scripts/build_app.sh

      - name: Create Standalone DMG
        run: ./scripts/create_dmg.sh

      - name: Notarize DMG (Optional)
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: ./scripts/notarize_app.sh

      - name: Generate Checksums
        run: |
          cd build/dist
          shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.dmg
            build/dist/*.zip
            build/dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
